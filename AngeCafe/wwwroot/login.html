
<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Ange Cafe | Login</title>
    <style>
        * {
            box-sizing: border-box;
        }

        body {
            margin: 0;
            min-height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            background: #F5F8FC;
            font-family: Arial, sans-serif;
        }

        .login-card {
            width: 90%;
            max-width: 400px;
            padding: 38px;
            background: white;
            border-radius: 14px;
            border-top: 5px solid #D4AF37;
            box-shadow: 0 8px 30px rgba(0,0,0,.12);
        }

        .brand {
            background: #111;
            color: white;
            text-align: center;
            padding: 22px;
            margin: -38px -38px 28px;
            border-radius: 9px 9px 0 0;
        }

            .brand h1 {
                margin: 0;
                letter-spacing: 3px;
            }

            .brand p {
                color: #D4AF37;
                margin-bottom: 0;
                font-size: 13px;
            }

        h2 {
            text-align: center;
            color: #091957;
            margin-bottom: 25px;
        }

        label {
            display: block;
            margin: 15px 0 7px;
            font-weight: bold;
            color: #333;
        }

        input {
            width: 100%;
            padding: 13px;
            border: 1px solid #ccc;
            border-radius: 7px;
            font-size: 15px;
        }

        button {
            width: 100%;
            margin-top: 25px;
            padding: 14px;
            border: none;
            border-radius: 7px;
            background: #111;
            color: #D4AF37;
            font-size: 16px;
            font-weight: bold;
            cursor: pointer;
        }

            button:hover {
                background: #333;
            }

            button:disabled {
                opacity: .6;
                cursor: not-allowed;
            }

        #message {
            margin-top: 15px;
            text-align: center;
            font-size: 14px;
            color: #c0392b;
        }
    </style>
</head>
<body>

    <div class="login-card">
        <div class="brand">
            <h1>ANGE CAFE</h1>
            <p>STAFF & ADMIN PORTAL</p>
        </div>

        <h2>Welcome Back</h2>

        <form id="loginForm">
            <label for="username">Username</label>
            <input type="text" id="username" required autocomplete="username">

            <label for="password">Password</label>
            <input type="password" id="password" required autocomplete="current-password">

            <button type="submit" id="loginButton">LOGIN</button>
            <div id="message" role="alert"></div>
        </form>
    </div>

    <script>const API_URL = "/api/Auth/login";

    // Decode JWT payload to read the user's role.
    function decodeToken(token) {
        const payload = token.split(".")[1];
        const base64 = payload.replace(/-/g, "+").replace(/_/g, "/");
        const decoded = atob(base64);
        const bytes = Uint8Array.from(decoded, c => c.charCodeAt(0));
        return JSON.parse(new TextDecoder().decode(bytes));
    }

    document.getElementById("loginForm").addEventListener("submit", async function(e) {
        e.preventDefault();

        const username = document.getElementById("username").value.trim();
        const password = document.getElementById("password").value;
        const message = document.getElementById("message");
        const button = document.getElementById("loginButton");

        message.textContent = "";
        button.disabled = true;
        button.textContent = "LOGGING IN...";

        try {
            const response = await fetch(API_URL, {
                method: "POST",
                headers: {
                    "Content-Type": "application/json"
                },
                body: JSON.stringify({ username, password })
            });

            const data = await response.json().catch(() => null);

            if (!response.ok || !data?.token) {
                throw new Error(
                    typeof data === "string" ? data : "Invalid username or password."
                );
            }

            const claims = decodeToken(data.token);
            const role = claims["http://schemas.microsoft.com/ws/2008/06/identity/claims/role"]
                || claims.role;

            if (role !== "Admin" && role !== "Waiter") {
                throw new Error("You are not authorized to access this portal.");
            }

            // Store token for authenticated API requests.
            sessionStorage.setItem("angeCafeToken", data.token);
            sessionStorage.setItem("angeCafeRole", role);

            if (role === "Admin") {
                window.location.href = "/admin-dashboard.html";
            } else {
                window.location.href = "/staff-orders.html";
            }

        } catch (error) {
            message.textContent = error.message || "Unable to connect to the server.";
        } finally {
            button.disabled = false;
            button.textContent = "LOGIN";
        }
    });</script>

</body>
</html>
